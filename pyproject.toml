[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onemodel"
version = "0.1.0"
description = "Research scaffolding for unified recommendation models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=0.31.0",
    "gin-config>=0.5.0",
    "torch>=2.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
onemodel-train = "onemodel.train:main"
onemodel-evaluate = "onemodel.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
